<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок: Крест</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 0; }
        
        header { background-color: #2c3e50; color: white; padding: 1rem; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: white; text-decoration: none; font-size: 1.5rem; padding-right: 15px; }
        .header-title { margin: 0; font-size: 1.2rem; flex-grow: 1; text-align: center; }
        .menu-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0; padding-left: 15px; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-height: 300px; display: flex; flex-direction: column; }
        .card h2 { color: #2c3e50; margin-top: 0; }
        
        .progress-bar { height: 8px; background-color: #e0e0e0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #3498db; width: 0%; transition: width 0.3s ease; }
        
        .image-placeholder { background: #eee; border: 2px dashed #ccc; padding: 40px 10px; text-align: center; color: #888; margin: 15px 0; border-radius: 5px; }
        
        .nav-buttons { display: flex; justify-content: space-between; margin-top: auto; padding-top: 20px; }
        .btn { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 1rem; cursor: pointer; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .btn-outline { background-color: transparent; color: #3498db; border: 2px solid #3498db; }

        /* Стили для выезжающего меню */
        .side-menu {
            position: fixed; top: 0; right: -260px;
            width: 250px; height: 100%; background-color: #2c3e50;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            padding-top: 10px; z-index: 1000;
            display: flex; flex-direction: column;
        }
        .side-menu.open { right: 0; }
        .side-menu a { color: white; padding: 15px 20px; text-decoration: none; font-size: 1.1rem; border-bottom: 1px solid #34495e; }
        .side-menu a:hover { background-color: #34495e; }
        .side-menu .close-btn { font-size: 2rem; text-align: right; padding: 5px 20px; border: none; background: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">←</a>
        <h2 class="header-title">Урок: <span id="lesson-title"></span></h2>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <div id="side-menu" class="side-menu">
        <button class="close-btn" onclick="closeMenu()">&times;</button>
        <a href="index.html">🏠 Главная</a>
        <a href="#">👤 Личный кабинет</a>
        <a href="#">📈 Мой прогресс</a>
        <a href="index.html">📚 Этапы сборки</a>
        <a href="#">📖 База формул</a>
        <a href="#">⏱ Таймер</a>
        <a href="#">⚙️ Настройки</a>
        <a href="#">❓ Помощь</a>
    </div>

    <div class="container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="card">
            <h2 id="card-title"></h2>
            <div id="card-text" style="font-size: 1.1rem; line-height: 1.6;"></div>
            <div id="card-image-container"></div>
            
            <div class="nav-buttons">
                <button class="btn btn-outline" id="btn-prev" onclick="prevCard()">Назад</button>
                <button class="btn" id="btn-next" onclick="nextCard()">Далее</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    
    <script>
        const lessonId = 'cross';
        const lesson = lessonsData[lessonId];
        let currentCard = 0;

        function renderCard() {
            document.getElementById('lesson-title').innerText = lesson.title;
            const card = lesson.cards[currentCard];
            document.getElementById('card-title').innerText = card.title;
            document.getElementById('card-text').innerHTML = card.text;
            
            const imgContainer = document.getElementById('card-image-container');
            if (card.image) {
                imgContainer.innerHTML = `<div class="image-placeholder">${card.image}</div>`;
            } else {
                imgContainer.innerHTML = '';
            }

            const progress = ((currentCard) / (lesson.cards.length - 1)) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';

            document.getElementById('btn-prev').disabled = (currentCard === 0);
            
            if (currentCard === lesson.cards.length - 1) {
                document.getElementById('btn-next').innerText = "Этап пройден!";
                document.getElementById('btn-next').style.backgroundColor = "#27ae60";
                document.getElementById('btn-next').onclick = function() { 
                    alert("Ура! Этап крест пройден!"); 
                    window.location.href = "index.html"; 
                };
            } else {
                document.getElementById('btn-next').innerText = "Далее";
                document.getElementById('btn-next').style.backgroundColor = "#3498db";
                document.getElementById('btn-next').onclick = nextCard;
            }
        }

        function nextCard() {
            if (currentCard < lesson.cards.length - 1) { currentCard++; renderCard(); }
        }
        function prevCard() {
            if (currentCard > 0) { currentCard--; renderCard(); }
        }

        function toggleMenu() { document.getElementById('side-menu').classList.add('open'); }
        function closeMenu() { document.getElementById('side-menu').classList.remove('open'); }

        renderCard();
    </script>
</body>
</html>
